<html>
    <head><title>Merchex</title></head>
    <body>
        <h1>Hello Django !</h1>
        <p>Mes groupes préférés sont :</p>
<ul>
    {% for band in bands %}
    <li>{{ band.name }}</li>
    {% endfor %}
</ul>
    J'ai..
    {% if bands|length < 2 %}
        peu de
    {% elif bands|length < 6 %}
        quelques
    {% else %}
        beaucoup de
    {% endif %}
        groupes préférés.
</p>
    </body>
</html>
